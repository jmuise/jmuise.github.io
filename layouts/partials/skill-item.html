{{- if .url }}
  <a class="skill-badge" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
    {{- with .icon }}<span class="nf-icon" aria-hidden="true">{{ . }}</span>{{ end -}}
    <span>{{ .name }}</span>
  </a>
{{- else }}
  <span class="skill-tag">
    {{- with .icon }}<span class="nf-icon" aria-hidden="true">{{ . }}</span>{{ end -}}
    <span>{{ .name }}</span>
  </span>
{{- end }}
